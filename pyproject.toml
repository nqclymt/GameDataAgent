[project]
name = "game-data-agent"
version = "0.1.0"
description = "数值 Agent：联动 luban 的配表生成工具"
requires-python = ">=3.11"
dependencies = [
    "flet>=0.23.0",
]

[project.optional-dependencies]
core = [
    "numpy>=1.26",
    "openpyxl>=3.1",
]
infer = [
    "scipy>=1.11",
    "scikit-learn>=1.4",
]
llm = [
    "openai>=1.40",
    "anthropic>=0.34",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "core*", "llm*", "config*"]
